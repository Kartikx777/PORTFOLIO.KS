<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        #menu-container {
            max-width: 600px;
            margin: auto;
        }

        .menu-item {
            background-color: #222;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .menu-item:hover {
            background-color: #444;
        }

        #back {
            display: block;
            margin: 20px auto;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid white;
            border-radius: 5px;
        }

        #back:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>

<body>
    <h1>Menu</h1>
    <div id="menu-container">
        <div class="menu-item">🍕 Pizza</div>
        <div class="menu-item">🍔 Burger</div>
        
        
    </div>

    <a href="index.html" id="back">Back to Home</a>
</body>

</html>
